name: tests

on:
  push:
    branches-ignore:
      - 'chatgpt-**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Check Python 3.9 source compatibility
        run: python tests/test_python39_compat.py

      - name: Checkout ASE2SPRKKR
        uses: actions/checkout@v7
        with:
          repository: lokik/ase2sprkkr-chat
          ref: develop
          path: .ci/ase2sprkkr

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Resolve both local projects in one transaction, using their declared
          # KKRunner dependency from PyPI. Otherwise
          # pip may look on PyPI for the not-yet-published backend beta7 when
          # installing the GUI, despite its local editable installation.
          # Package identity tests also need setuptools at runtime.
          python -m pip install -e ./.ci/ase2sprkkr -e . pytest 'setuptools>=61'

      - name: Run tests
        run: python -m pytest -v --tb=short
